<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparky - School AI Robot Companion</title>
  <style>
    :root {
      --bg-color: #121829;
      --face-bg: #1e293b;
      --neon-blue: #38bdf8;
      --neon-green: #4ade80;
      --neon-yellow: #facc15;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Robot Screen Container */
    .robot-head {
      width: 480px;
      height: 340px;
      background: var(--face-bg);
      border: 8px solid var(--neon-blue);
      border-radius: 50px;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.4), inset 0 0 25px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color 0.3s, box-shadow 0.3s;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* Eyes */
    .eyes-container {
      display: flex;
      gap: 90px;
      margin-bottom: 45px;
    }

    .eye {
      width: 75px;
      height: 95px;
      background: var(--neon-blue);
      border-radius: 40px;
      box-shadow: 0 0 25px var(--neon-blue);
      position: relative;
      animation: blink 4.5s infinite;
      transition: all 0.3s ease;
    }

    .eye::after {
      content: '';
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 18px;
      left: 18px;
    }

    @keyframes blink {
      0%, 94%, 98% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    /* Mouth */
    .mouth {
      width: 110px;
      height: 24px;
      background: var(--neon-blue);
      border-radius: 10px 10px 60px 60px;
      box-shadow: 0 0 20px var(--neon-blue);
      transition: all 0.2s ease;
    }

    /* --- EMOTION & ACTION STATES --- */

    /* Listening State */
    .robot-head.listening {
      border-color: var(--neon-green);
      box-shadow: 0 0 50px rgba(74, 222, 128, 0.5);
    }
    .robot-head.listening .eye {
      background: var(--neon-green);
      box-shadow: 0 0 25px var(--neon-green);
      transform: scale(1.1);
    }
    .robot-head.listening .mouth {
      background: var(--neon-green);
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }

    /* Thinking State */
    .robot-head.thinking {
      border-color: var(--neon-yellow);
    }
    .robot-head.thinking .eye {
      background: var(--neon-yellow);
      box-shadow: 0 0 25px var(--neon-yellow);
      height: 45px;
      animation: lookAround 1.2s infinite alternate;
    }
    .robot-head.thinking .mouth {
      background: var(--neon-yellow);
      width: 40px;
      height: 15px;
      border-radius: 20px;
    }

    @keyframes lookAround {
      0% { transform: translateX(-15px); }
      100% { transform: translateX(15px); }
    }

    /* Speaking State */
    .robot-head.speaking .mouth {
      animation: talk 0.22s infinite alternate;
    }

    @keyframes talk {
      0% { height: 16px; border-radius: 20px; width: 90px; }
      100% { height: 65px; border-radius: 20px 20px 70px 70px; width: 120px; }
    }

    /* Controls & Captions */
    .controls {
      margin-top: 30px;
      text-align: center;
      max-width: 600px;
      padding: 0 20px;
    }

    #talk-btn {
      background: var(--neon-blue);
      color: #0f172a;
      border: none;
      padding: 15px 35px;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    #talk-btn:hover { transform: scale(1.05); }
    #talk-btn:active { transform: scale(0.95); }

    #subtitle {
      margin-top: 20px;
      font-size: 1.2rem;
      min-height: 2.5em;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Robot Face UI -->
  <div class="robot-head" id="robot">
    <div class="eyes-container">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="mouth"></div>
  </div>

  <!-- Interactive Controls -->
  <div class="controls">
    <button id="talk-btn">🎤 Press & Ask Sparky!</button>
    <button id="key-btn" style="background:#334155; color:white; border:none; padding:15px 20px; border-radius:50px; cursor:pointer; margin-left:10px;" title="Set API Key">⚙️ Key</button>
    <p id="subtitle">Hi friend! Press the button and ask me a question!</p>
  </div>

  <script>
    const robot = document.getElementById('robot');
    const talkBtn = document.getElementById('talk-btn');
    const keyBtn = document.getElementById('key-btn');
    const subtitle = document.getElementById('subtitle');

    // Your Google Apps Script Web App URL (used automatically if no local key is entered)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfoMxIDaV7OzWWy5iC58fXsxJbSmZWY90fAEDZwwusgSXypebmGF3kvgAP3Yb0-qm_6w/exec";

    // 1. Setup Speech Recognition (Microphone Input)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (!SpeechRecognition) {
      subtitle.innerText = "⚠️ Please open this page in Google Chrome or Microsoft Edge for voice support!";
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onresult = async (event) => {
        const childQuestion = event.results[0][0].transcript;
        subtitle.innerText = `You asked: "${childQuestion}"`;

        setRobotState('thinking', "Hmm, let me think about that...");

        const reply = await getAIResponse(childQuestion);
        speakResponse(reply);
      };

      recognition.onerror = (event) => {
        console.warn("Speech Recognition Error:", event.error);
        if (event.error === 'not-allowed') {
          setRobotState('idle', "⚠️ Microphone blocked! Click the lock/tune icon in your browser address bar and allow the Microphone.");
        } else {
          setRobotState('idle', "Oops! I didn't catch that. Press the button and try speaking again!");
        }
      };
    }

    // 2. Setup Speech Synthesis (Speaker Output)
    const synth = window.speechSynthesis;

    // Button Click -> Start Listening
    talkBtn.addEventListener('click', () => {
      if (!recognition) {
        alert("Please open this file in Google Chrome or Microsoft Edge so the microphone can work!");
        return;
      }
      if (synth.speaking) synth.cancel();
      try {
        recognition.start();
        setRobotState('listening', "I'm listening... ask your question!");
      } catch (err) {
        console.log("Mic already active:", err);
      }
    });

    // Gear Button Click -> Save API Key in Browser LocalStorage
    keyBtn.addEventListener('click', () => {
      const currentKey = localStorage.getItem('SPARKY_GEMINI_KEY') || '';
      const newKey = prompt('Paste your Gemini API Key (saved only in this browser):', currentKey);
      if (newKey !== null) {
        localStorage.setItem('SPARKY_GEMINI_KEY', newKey.trim());
        subtitle.innerText = newKey.trim()
          ? "✅ API Key saved in browser! Press the mic button and ask me anything!"
          : "⚠️ Local Key cleared. Using Google Apps Script fallback.";
      }
    });

    // Helper: Switch Robot CSS Expressions
    function setRobotState(state, message) {
      robot.className = 'robot-head ' + (state !== 'idle' ? state : '');
      if (message) subtitle.innerText = message;
    }

    // 3. AI Brain Logic with Automatic Model Fallback
    async function getAIResponse(userText) {
      const API_KEY = localStorage.getItem('SPARKY_GEMINI_KEY') || "";

      const systemPersona = `
        You are Sparky, a cheerful, curious, and friendly classroom robot built for a school science project.
        Rules:
        1. Explain concepts simply so a 7 to 11-year-old child can easily understand.
        2. Keep answers very short (2 to 3 sentences maximum) because you are speaking out loud.
        3. Use enthusiastic, encouraging language (e.g., "Beep boop!", "Great question!").
        4. Never discuss inappropriate, scary, or adult topics.
      `;

      const payload = {
        system_instruction: { parts: [{ text: systemPersona }] },
        contents: [{ parts: [{ text: userText }] }]
      };

      // Current active Gemini Flash models in order of priority
      const modelsToTry = [
        "gemini-3.5-flash-lite",
        "gemini-3.7-flash",
        "gemini-3.6-flash",
        "gemini-3.2-flash",
        "gemini-3.1-flash-lite"
      ];

      let lastError = "";

      // MODE A: If you pasted a key in the ⚙️ Key button, call Gemini directly and auto-select a working model
      if (API_KEY) {
        for (const modelName of modelsToTry) {
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              }
            );

            const data = await response.json();

            if (!data.error && data.candidates && data.candidates[0]) {
              console.log(`✅ Connected using model: ${modelName}`);
              return data.candidates[0].content.parts[0].text;
            }

            if (data.error) {
              console.warn(`Model ${modelName} skipped:`, data.error.message);
              lastError = data.error.message;
            }
          } catch (err) {
            console.error(`Network error on ${modelName}:`, err);
            lastError = err.message;
          }
        }
        return `Oops! My AI key reported an error: ${lastError}`;
      }

      // MODE B: If no key is in LocalStorage, use your Google Apps Script URL
      if (APPS_SCRIPT_URL) {
        try {
          const response = await fetch(https://script.google.com/macros/s/AKfycbyfoMxIDaV7OzWWy5iC58fXsxJbSmZWY90fAEDZwwusgSXypebmGF3kvgAP3Yb0-qm_6w/exec, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Prevents CORS block on Google Apps Script
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (data.error) {
            return `Oops! My Apps Script reported an error: ${data.error.message}`;
          }
          return data.candidates[0].content.parts[0].text;
        } catch (err) {
          return "Uh oh! My Google Apps Script link didn't respond. Try clicking the gear button and pasting your API key directly!";
        }
      }

      return "Beep boop! Please click the gear button at the bottom and paste your Gemini API key!";
    }

    // 4. Speak the Answer & Animate the Mouth
    function speakResponse(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.3;
      utterance.rate = 1.0;

      utterance.onstart = () => {
        setRobotState('speaking', text);
      };

      utterance.onend = () => {
        setRobotState('idle', text);
      };

      utterance.onerror = () => {
        setRobotState('idle', text);
      };

      synth.speak(utterance);
    }
  </script>
</body>
</html>
