<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparky - School AI Robot Companion</title>
  <style>
    :root {
      --bg-color: #121829;
      --face-bg: #1e293b;
      --neon-blue: #38bdf8;
      --neon-green: #4ade80;
      --neon-yellow: #facc15;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Robot Screen Container */
    .robot-head {
      width: 480px;
      height: 340px;
      background: var(--face-bg);
      border: 8px solid var(--neon-blue);
      border-radius: 50px;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.4), inset 0 0 25px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color 0.3s, box-shadow 0.3s;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* Eyes */
    .eyes-container {
      display: flex;
      gap: 90px;
      margin-bottom: 45px;
    }

    .eye {
      width: 75px;
      height: 95px;
      background: var(--neon-blue);
      border-radius: 40px;
      box-shadow: 0 0 25px var(--neon-blue);
      position: relative;
      animation: blink 4.5s infinite;
      transition: all 0.3s ease;
    }

    .eye::after {
      content: '';
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 18px;
      left: 18px;
    }

    @keyframes blink {
      0%, 94%, 98% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    /* Mouth */
    .mouth {
      width: 110px;
      height: 24px;
      background: var(--neon-blue);
      border-radius: 10px 10px 60px 60px;
      box-shadow: 0 0 20px var(--neon-blue);
      transition: all 0.2s ease;
    }

    /* --- EMOTION & ACTION STATES --- */

    /* Listening State */
    .robot-head.listening {
      border-color: var(--neon-green);
      box-shadow: 0 0 50px rgba(74, 222, 128, 0.5);
    }
    .robot-head.listening .eye {
      background: var(--neon-green);
      box-shadow: 0 0 25px var(--neon-green);
      transform: scale(1.1);
    }
    .robot-head.listening .mouth {
      background: var(--neon-green);
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }

    /* Thinking State */
    .robot-head.thinking {
      border-color: var(--neon-yellow);
    }
    .robot-head.thinking .eye {
      background: var(--neon-yellow);
      box-shadow: 0 0 25px var(--neon-yellow);
      height: 45px;
      animation: lookAround 1.2s infinite alternate;
    }
    .robot-head.thinking .mouth {
      background: var(--neon-yellow);
      width: 40px;
      height: 15px;
      border-radius: 20px;
    }

    @keyframes lookAround {
      0% { transform: translateX(-15px); }
      100% { transform: translateX(15px); }
    }

    /* Speaking State */
    .robot-head.speaking .mouth {
      animation: talk 0.22s infinite alternate;
    }

    @keyframes talk {
      0% { height: 16px; border-radius: 20px; width: 90px; }
      100% { height: 65px; border-radius: 20px 20px 70px 70px; width: 120px; }
    }

    /* Controls & Captions */
    .controls {
      margin-top: 30px;
      text-align: center;
      max-width: 600px;
      padding: 0 20px;
    }

    #talk-btn {
      background: var(--neon-blue);
      color: #0f172a;
      border: none;
      padding: 15px 35px;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    #talk-btn:hover { transform: scale(1.05); }
    #talk-btn:active { transform: scale(0.95); }

    #subtitle {
      margin-top: 20px;
      font-size: 1.2rem;
      min-height: 2.5em;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Robot Face UI -->
  <div class="robot-head" id="robot">
    <div class="eyes-container">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="mouth"></div>
  </div>

  <!-- Interactive Controls -->
  <div class="controls">
    <button id="talk-btn">🎤 Press & Ask Sparky!</button>
    <button id="key-btn" style="background:#334155; color:white; border:none; padding:15px 20px; border-radius:50px; cursor:pointer; margin-left:10px;" title="Set API Key">⚙️ Key</button>
    <p id="subtitle">Hi friend! Press the button and ask me a question!</p>
  </div>

  <script>
    const keyBtn = document.getElementById('key-btn');

    // Save API Key in Browser LocalStorage (Never uploaded to GitHub!)
    keyBtn.addEventListener('click', () => {
      const currentKey = localStorage.getItem('SPARKY_GEMINI_KEY') || '';
      const newKey = prompt('Paste your Gemini API Key (saved only in this browser):', currentKey);
      if (newKey !== null) {
        localStorage.setItem('SPARKY_GEMINI_KEY', newKey.trim());
        subtitle.innerText = newKey.trim() 
          ? "✅ API Key saved in browser! Ask me anything!" 
          : "⚠️ API Key cleared. Running in offline demo mode.";
      }
    });

    async function getAIResponse(userText) {
      // Reads key from the laptop browser memory instead of hardcoded GitHub text
      const API_KEY = localStorage.getItem('SPARKY_GEMINI_KEY') || "";

      const systemPersona = `
        You are Sparky, a cheerful, curious, and friendly classroom robot built for a school science project.
        Rules:
        1. Explain concepts simply so a 7 to 11-year-old child can easily understand.
        2. Keep answers very short (2 to 3 sentences maximum) because you are speaking out loud.
        3. Use enthusiastic, encouraging language (e.g., "Beep boop!", "Great question!").
        4. Never discuss inappropriate, scary, or adult topics.
      `;

      if (!API_KEY) {
        await new Promise(r => setTimeout(r, 800));
        return "Beep boop! Please click the gear button at the bottom and paste your Gemini API key so my brain can connect!";
      }

      try {
        const response = await fetch(`https://script.google.com/macros/s/AKfycbxq04iCG8I1BjmP6fyLIN6-snIAOHSrouEEByhqlIy2/dev`), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPersona }] },
            contents: [{ parts: [{ text: userText }] }]
          })
        });
        const data = await response.json();

        if (data.error) {
          console.error("Gemini API Error:", data.error);
          return `Oops! My AI key reported an error: ${data.error.message}`;
        }

        return data.candidates[0].content.parts[0].text;
      } catch (error) {
        return "Uh oh, my Wi-Fi antenna is ticklish right now! Can you ask me again?";
      }
    }
  </script>
</body>
</html>
